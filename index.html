<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cod3x Code v4.0 by CodexHaven</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #00D4AA;
      --secondary: #6366F1;
      --bg: #0a0a0f;
      --surface: #13131f;
      --surface-light: #1a1a2e;
      --text: #e0e0e0;
      --text-dim: #888;
      --border: #2a2a3e;
      --success: #22c55e;
      --warning: #eab308;
      --error: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 18px;
    }
    .logo-text { font-size: 18px; font-weight: 700; }
    .logo-text span { color: var(--primary); }
    .header-status { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-dim); }
    .badge { padding: 2px 8px; border-radius: 4px; background: var(--surface-light); font-size: 11px; }
    .badge.green { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge.yellow { background: rgba(234,179,8,0.15); color: var(--warning); }

    .container { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }
    .sidebar-section { margin-bottom: 20px; }
    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .toggle-switch:hover { background: var(--surface-light); }
    .toggle-switch .label { font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .toggle-switch .desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .toggle { width: 32px; height: 18px; border-radius: 9px; background: var(--border); position: relative; transition: 0.2s; flex-shrink: 0; }
    .toggle::after { content: ''; position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: 0.2s; }
    .toggle.active { background: var(--primary); }
    .toggle.active::after { left: 16px; }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 20px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.15s; color: var(--text-dim); }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(0,212,170,0.05); }

    .tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
    .tab-content.active { display: flex; }

    .chat-area { flex: 1; overflow-y: auto; padding: 20px; }
    .message { margin-bottom: 16px; max-width: 90%; }
    .message.user { margin-left: auto; }
    .message-bubble { padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .message.user .message-bubble { background: var(--primary); color: #000; }
    .message.assistant .message-bubble { background: var(--surface-light); border: 1px solid var(--border); }
    .message.system .message-bubble { background: rgba(239,68,68,0.1); border: 1px solid var(--error); color: var(--error); font-size: 12px; }
    .message-role { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
    .message.user .message-role { text-align: right; }

    .input-area {
      padding: 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .input-area input:focus { border-color: var(--primary); }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.15s;
    }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary { background: var(--surface-light); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .panel { padding: 20px; overflow-y: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .card {
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: 0.15s;
    }
    .card:hover { border-color: var(--primary); }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    .card-meta { font-size: 11px; color: var(--text-dim); margin-top: 8px; display: flex; gap: 12px; }

    .settings-group { margin-bottom: 20px; }
    .settings-label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .settings-input {
      width: 100%;
      max-width: 400px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      margin-bottom: 8px;
    }
    .settings-input:focus { border-color: var(--primary); }

    .loading { display: flex; align-items: center; gap: 8px; color: var(--primary); font-size: 13px; padding: 12px 0; }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .quick-actions { display: flex; gap: 6px; padding: 0 20px 10px; flex-wrap: wrap; }
    .quick-btn { padding: 4px 10px; border-radius: 4px; background: var(--surface-light); border: 1px solid var(--border); color: var(--text-dim); font-size: 11px; cursor: pointer; }
    .quick-btn:hover { color: var(--primary); border-color: var(--primary); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .header-status { display: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">C</div>
      <div class="logo-text">Cod3x <span>Code</span> v4.0</div>
    </div>
    <div class="header-status">
      <span id="status-badge" class="badge yellow">Initializing...</span>
      <span id="tools-count">Tools: -</span>
      <span id="agents-count">Agents: -</span>
      <span id="llm-info">LLM: -</span>
    </div>
  </div>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Tools <span id="tools-toggle-count"></span></div>
        <div id="tools-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Agents <span id="agents-toggle-count"></span></div>
        <div id="agents-list"></div>
      </div>
    </div>

    <div class="main">
      <div class="tabs">
        <div class="tab active" data-tab="chat">Chat</div>
        <div class="tab" data-tab="tools">Tools</div>
        <div class="tab" data-tab="agents">Agents</div>
        <div class="tab" data-tab="swarm">Swarm</div>
        <div class="tab" data-tab="settings">Settings</div>
      </div>

      <div class="tab-content active" id="tab-chat">
        <div class="chat-area" id="chat-messages"></div>
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickMsg('Analyze this codebase')">Analyze codebase</button>
          <button class="quick-btn" onclick="quickMsg('Fix any bugs in the code')">Fix bugs</button>
          <button class="quick-btn" onclick="quickMsg('!agent code-review Review the main files')">Code review</button>
          <button class="quick-btn" onclick="quickMsg('!agent tester Write tests')">Write tests</button>
          <button class="quick-btn" onclick="quickMsg('!swarm Refactor and optimize with tests')">Swarm refactor</button>
        </div>
        <div class="input-area">
          <input type="text" id="chat-input" placeholder="Ask Cod3x anything... (type /help for commands)" onkeydown="if(event.key==='Enter')sendMessage()">
          <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>

      <div class="tab-content" id="tab-tools">
        <div class="panel">
          <div class="grid" id="tools-grid"></div>
        </div>
      </div>

      <div class="tab-content" id="tab-agents">
        <div class="panel">
          <div class="grid" id="agents-grid"></div>
        </div>
      </div>

      <div class="tab-content" id="tab-swarm">
        <div class="panel">
          <div style="max-width: 600px;">
            <h3 style="margin-bottom: 16px;">Swarm Mode</h3>
            <p style="color: var(--text-dim); margin-bottom: 20px; font-size: 13px;">
              Decompose complex tasks into subtasks and execute them across multiple specialized agents in parallel.
            </p>
            <div class="settings-group">
              <div class="settings-label">Objective</div>
              <textarea id="swarm-objective" class="settings-input" style="height: 100px; resize: vertical; font-family: inherit;" placeholder="Describe a complex task to decompose..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="runSwarm()">Run Swarm</button>
            <div id="swarm-result" style="margin-top: 20px;"></div>
          </div>
        </div>
      </div>

      <div class="tab-content" id="tab-settings">
        <div class="panel">
          <div style="max-width: 600px;">
            <h3 style="margin-bottom: 16px;">Configuration</h3>
            <div id="settings-content"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'chat';
    let activeTools = new Set();
    let activeAgents = new Set();
    let isLoading = false;

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
        currentTab = tab.dataset.tab;
      });
    });

    async function api(method, endpoint, body) {
      const opts = { method, headers: {} };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch('/api/' + endpoint, opts);
      return res.json();
    }

    async function loadStatus() {
      try {
        const { data } = await api('GET', 'status');
        document.getElementById('status-badge').textContent = data.llm.available.length > 0 ? 'Ready' : 'No LLM';
        document.getElementById('status-badge').className = 'badge ' + (data.llm.available.length > 0 ? 'green' : 'yellow');
        document.getElementById('tools-count').textContent = 'Tools: ' + data.tools;
        document.getElementById('agents-count').textContent = 'Agents: ' + data.agents;
        document.getElementById('llm-info').textContent = data.llm.model + ' (' + data.llm.provider + ')';
      } catch(e) {}
    }

    async function loadTools() {
      try {
        const { data } = await api('GET', 'tools');
        const list = document.getElementById('tools-list');
        const grid = document.getElementById('tools-grid');
        list.innerHTML = '';
        grid.innerHTML = '';
        document.getElementById('tools-toggle-count').textContent = '(' + data.count + ')';

        const icons = {
          filesystem: '📁', execution: '⚡', git: '🌿', code: '💻',
          search: '🔍', network: '🌐', browser: '🖼️', debug: '🐛',
          ai: '🧠', project: '📦', testing: '✅', utility: '🛠️',
          documentation: '📚', database: '🗄️',
        };

        data.tools.forEach(tool => {
          activeTools.add(tool.name);

          // Sidebar toggle
          const div = document.createElement('div');
          div.className = 'toggle-switch';
          div.innerHTML = `
            <div>
              <div class="label">
                <span>${icons[tool.category] || '🔧'}</span>
                ${tool.name}
              </div>
              <div class="desc">${tool.category}</div>
            </div>
            <div class="toggle active" data-tool="${tool.name}"></div>
          `;
          div.querySelector('.toggle').addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            if (this.classList.contains('active')) activeTools.add(tool.name);
            else activeTools.delete(tool.name);
          });
          list.appendChild(div);

          // Grid card
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-title">${icons[tool.category] || '🔧'} ${tool.name}</div>
            <div class="card-desc">${tool.description}</div>
            <div class="card-meta">
              <span>${tool.category}</span>
              <span>${tool.requiresApproval ? '⚠️ requires approval' : '✓ auto'}</span>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch(e) { console.error('Failed to load tools:', e); }
    }

    async function loadAgents() {
      try {
        const { data } = await api('GET', 'agents');
        const list = document.getElementById('agents-list');
        const grid = document.getElementById('agents-grid');
        list.innerHTML = '';
        grid.innerHTML = '';
        document.getElementById('agents-toggle-count').textContent = '(' + data.count + ')';

        data.agents.forEach(agent => {
          activeAgents.add(agent.id);

          // Sidebar toggle
          const div = document.createElement('div');
          div.className = 'toggle-switch';
          div.innerHTML = `
            <div>
              <div class="label">🤖 ${agent.name}</div>
              <div class="desc">${agent.role}</div>
            </div>
            <div class="toggle active" data-agent="${agent.id}"></div>
          `;
          div.querySelector('.toggle').addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            if (this.classList.contains('active')) activeAgents.add(agent.id);
            else activeAgents.delete(agent.id);
          });
          list.appendChild(div);

          // Grid card
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-title">🤖 ${agent.name}</div>
            <div class="card-desc">${agent.description}</div>
            <div class="card-meta">
              <span>${agent.role}</span>
              <span>${agent.tools.length} tools</span>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch(e) { console.error('Failed to load agents:', e); }
    }

    async function loadConfig() {
      try {
        const { data } = await api('GET', 'config');
        const container = document.getElementById('settings-content');
        container.innerHTML = `
          <div class="settings-group">
            <div class="settings-label">Project</div>
            <input class="settings-input" value="${data.name}" readonly>
          </div>
          <div class="settings-group">
            <div class="settings-label">Model</div>
            <input class="settings-input" value="${data.model}" readonly>
          </div>
          <div class="settings-group">
            <div class="settings-label">Provider</div>
            <input class="settings-input" value="${data.provider}" readonly>
          </div>
          <div class="settings-group">
            <div class="settings-label">Temperature</div>
            <input class="settings-input" value="${data.temperature}" readonly>
          </div>
          <div class="settings-group">
            <div class="settings-label">Max Tokens</div>
            <input class="settings-input" value="${data.maxTokens}" readonly>
          </div>
          <div class="settings-group">
            <div class="settings-label">Platform</div>
            <input class="settings-input" value="${data.platform}" readonly>
          </div>
          <div class="settings-group">
            <div class="settings-label">Features</div>
            <div style="font-size: 12px; color: var(--text-dim);">
              ${Object.entries(data.features).map(([k,v]) => `<div>${k}: ${v ? '✅' : '❌'}</div>`).join('')}
            </div>
          </div>
        `;
      } catch(e) {}
    }

    function addMessage(role, content) {
      const area = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.innerHTML = `
        <div class="message-role">${role === 'user' ? 'You' : role === 'assistant' ? 'Cod3x by CodexHaven' : 'System'}</div>
        <div class="message-bubble"></div>
      `;
      div.querySelector('.message-bubble').textContent = content;
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const btn = document.getElementById('send-btn');
      const message = input.value.trim();
      if (!message || isLoading) return;

      input.value = '';
      addMessage('user', message);
      setLoading(true);

      try {
        const result = await api('POST', 'chat', { message });
        if (result.success) {
          addMessage('assistant', result.data.response);
        } else {
          addMessage('system', 'Error: ' + result.error);
        }
      } catch(e) {
        addMessage('system', 'Network error: ' + e.message);
      }
      setLoading(false);
    }

    function quickMsg(text) {
      document.getElementById('chat-input').value = text;
      sendMessage();
    }

    async function runSwarm() {
      const objective = document.getElementById('swarm-objective').value.trim();
      if (!objective) return;
      const resultDiv = document.getElementById('swarm-result');
      resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Running swarm...</div>';
      try {
        const result = await api('POST', 'swarm', { objective });
        if (result.success) {
          resultDiv.innerHTML = `
            <div class="card">
              <div class="card-title">✅ Swarm Complete</div>
              <div class="card-desc" style="white-space: pre-wrap; margin-top: 10px;">${result.data.summary}</div>
              <div class="card-meta">Duration: ${(result.data.duration / 1000).toFixed(1)}s | Tokens: ${result.data.tokensUsed || 'N/A'}</div>
              <pre style="margin-top: 12px; padding: 12px; background: var(--bg); border-radius: 6px; font-size: 12px; overflow-x: auto;"><code>${escapeHtml(result.data.output || '')}</code></pre>
            </div>
          `;
        } else {
          resultDiv.innerHTML = '<div class="card" style="border-color: var(--error);"><div class="card-title">❌ Failed</div><div class="card-desc">' + escapeHtml(result.error) + '</div></div>';
        }
      } catch(e) {
        resultDiv.innerHTML = '<div class="card" style="border-color: var(--error);"><div class="card-title">❌ Error</div><div class="card-desc">' + escapeHtml(e.message) + '</div></div>';
      }
    }

    function setLoading(loading) {
      isLoading = loading;
      document.getElementById('send-btn').disabled = loading;
      document.getElementById('chat-input').disabled = loading;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    addMessage('assistant', 'Welcome to Cod3x Code v4.0 by CodexHaven! 👋\n\nI can help you with coding tasks using ' + (activeTools.size || '70+') + ' tools and 14 specialized agents.\n\nQuick commands:\n• Type naturally to chat\n• !agent <role> <task> - Run a specific agent\n• !swarm <objective> - Use swarm mode for complex tasks\n• /help - Show all commands');
    loadStatus();
    loadTools();
    loadAgents();
    loadConfig();
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
